[workspace]
resolver = "2"
members = [
    "crates/indicators",
    "crates/shared",
    "crates/factors",
    "crates/signals",
]

[workspace.package]
edition      = "2021"
rust-version = "1.98.1"
license      = "MIT"
authors      = ["TickFlow Kernel Team <kernel@local>"]

# === Workspace dependency pin (ADR-0002) ===
# Pinned absolutely (not range-pinned) to lock ABI across pyO3/polars re-roll.
# Upgrade path: bump + re-stress + new ADR — never silent update.
# IMPORTANT: `polars` Rust crate does NOT expose a `python` feature — the
# Python integration lives in `pyo3-polars` (which re-exports `PyDataFrame`
# tied to this exact polars version). Hivebook 2026-09 sample confirms.
[workspace.dependencies]
polars              = { version = "=0.55.2", features = ["lazy", "parquet", "csv"] }
pyo3                = { version = "=0.29",   features = ["extension-module", "abi3-py310"] }
pyo3-polars         = { version = "=0.28.0", features = ["derive"] }
pyo3-polars-derive  = "=0.22.0"

# === Lints ===
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# PyO3 #[pyclass] / #[pyfunction] expand to unsafe internally; keep
# `unsafe_code` at warn rather than deny — only lib.rs explicit unsafe
# surface should raise alarms.
[workspace.lints.rust]
unsafe_code = "warn"

# === Profiles ===
# maturin + pyo3-polars want LTO + codegen-units=1 for stable ABI
# across rebuilds (matches Hivebook 2026-09 canonical setup).
[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1

[profile.dev]
opt-level = 0
debug     = true

# === Vendored polars 0.55.2 patches (TF-RS-1) ===
# ADR-0003 — the upstream polars-ops / polars-mem-engine / polars-stream
# 0.55.2 release ships non-exhaustive `match` expressions gated behind
# feature flags (`python`, `object`) that the crate's OWN default
# feature set does NOT enable. The 5-mismatch pattern forces a
# workspace that uses `pyo3-polars` (no `polars` `python` feature)
# to either:
#   (a) hit E0004 at every compile, or
#   (b) carry cargo cache source patches that don't survive `cargo clean`.
#
# Vendoring the three affected crates (path-based [patch.crates-io])
# makes the fix durable — it lives in this repo's git, not in the
# global cargo cache. When polars-ops / polars-mem-engine / polars-stream
# ship 0.55.3+ with the upstream match bugs fixed, delete the
# `vendor/<name>/` directories and this section in one commit.
#
# Do not hand-edit files in `vendor/` without keeping the TF-RS-1
# comment markers in sync with the comment block in this section.
[patch.crates-io]
polars-ops        = { path = "vendor/polars-ops" }
polars-mem-engine = { path = "vendor/polars-mem-engine" }
polars-stream     = { path = "vendor/polars-stream" }
